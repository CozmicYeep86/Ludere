name: Autogen

on:
  workflow_dispatch:
    inputs:
      payload:
        required: true
        description: 'Direct URL to autogen payload zip'

jobs:
  autogen:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fetch payload
        run: |
          mkdir -p ./autogen/input/
          curl -L# "${{ github.event.inputs.payload }}" > ./autogen/input/payload.zip
       
      - name: Unzip payload
        run: |
          unzip ./autogen/input/payload.zip -d ./autogen/input/
          rm ./autogen/input/payload.zip
      
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y xmlstarlet
      
      - name: Run autogen
        run: |
          chmod +x ./autogen/generate
          ./autogen/generate
        
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Get date
        id: date
        run: echo "date=$(date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ludere-autogen-${{ steps.date.outputs.date }}
          name: Ludere Autogen ${{ steps.date.outputs.date }}
          files: |
            app/build/outputs/apk/release/app-universal-release.apk
